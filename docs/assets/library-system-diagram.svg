<svg width="680" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="680" height="720" fill="#ffffff" rx="12"/>

  <!-- 凡例 -->
  <rect x="40" y="18" width="14" height="14" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="60" y="30" font-size="12" fill="#444441">源内で対応できる</text>
  <rect x="210" y="18" width="14" height="14" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="230" y="30" font-size="12" fill="#444441">自作が必要</text>
  <rect x="340" y="18" width="14" height="14" rx="3" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="360" y="30" font-size="12" fill="#444441">外部サービス（LLM）</text>

  <!-- 市民端末UI（自作） -->
  <rect x="240" y="55" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="78" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">図書館端末UI</text>
  <text x="340" y="98" font-size="12" fill="#993C1D" text-anchor="middle">市民が操作するフロント</text>

  <!-- 矢印 -->
  <line x1="340" y1="111" x2="340" y2="143" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="131" font-size="11" fill="#888780">API呼び出し</text>

  <!-- 源内Web（源内） -->
  <rect x="160" y="145" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="168" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">源内 Web（genai-web）</text>
  <text x="340" y="188" font-size="12" fill="#0F6E56" text-anchor="middle">チャットUI・AIアプリ管理・チーム管理・認証</text>

  <!-- 矢印 -->
  <line x1="340" y1="201" x2="340" y2="233" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 源内プロトコル -->
  <rect x="190" y="235" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="253" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">源内 AIアプリプロトコル</text>
  <text x="340" y="269" font-size="12" fill="#0F6E56" text-anchor="middle">REST API（inputs → outputs）</text>

  <!-- 分岐矢印 -->
  <line x1="265" y1="279" x2="175" y2="318" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="279" x2="505" y2="318" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 汎用AIチャット（源内） -->
  <rect x="60" y="320" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="170" y="343" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">汎用AIチャット</text>
  <text x="170" y="363" font-size="12" fill="#0F6E56" text-anchor="middle">要約・翻訳・Q&amp;A（源内標準）</text>

  <!-- 蔵書RAGアプリ（自作） -->
  <rect x="400" y="320" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="510" y="343" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">蔵書RAGアプリ</text>
  <text x="510" y="363" font-size="12" fill="#993C1D" text-anchor="middle">蔵書を検索して回答（自作）</text>

  <!-- 矢印 汎用AI→LLM -->
  <line x1="170" y1="376" x2="170" y2="413" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 矢印 蔵書RAG→ベクトルDB -->
  <line x1="470" y1="376" x2="400" y2="413" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 矢印 蔵書RAG→LLM -->
  <line x1="550" y1="376" x2="600" y2="413" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect x="70" y="415" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="170" y="438" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">LLM</text>
  <text x="170" y="458" font-size="12" fill="#5F5E5A" text-anchor="middle">GPT-4o / Gemini / Ollama等</text>

  <!-- ベクトルDB（自作） -->
  <rect x="300" y="415" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="400" y="438" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">ベクトルDB</text>
  <text x="400" y="458" font-size="12" fill="#993C1D" text-anchor="middle">pgvector / Qdrant等</text>

  <!-- 変換パイプライン（自作） -->
  <rect x="510" y="415" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="585" y="438" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">変換パイプライン</text>
  <text x="585" y="458" font-size="12" fill="#993C1D" text-anchor="middle">PDF→テキスト→埋め込み</text>

  <!-- 矢印 変換→ベクトルDB -->
  <line x1="510" y1="443" x2="500" y2="443" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 蔵書アーカイブ（自作） -->
  <rect x="510" y="510" width="150" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="585" y="528" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">蔵書アーカイブ</text>
  <text x="585" y="544" font-size="12" fill="#993C1D" text-anchor="middle">PDF / 画像 / テキスト</text>

  <!-- 矢印 アーカイブ→変換 -->
  <line x1="585" y1="510" x2="585" y2="471" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 認証（源内） -->
  <rect x="60" y="510" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="160" y="528" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">認証・アクセス管理</text>
  <text x="160" y="544" font-size="12" fill="#0F6E56" text-anchor="middle">Cognito / SAML（源内標準）</text>

  <!-- 区切り線 -->
  <line x1="40" y1="595" x2="640" y2="595" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="340" y="614" font-size="12" fill="#888780" text-anchor="middle">作業量まとめ</text>

  <!-- まとめ 源内 -->
  <rect x="40" y="625" width="280" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="180" y="648" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">源内がやってくれること</text>
  <text x="180" y="667" font-size="12" fill="#0F6E56" text-anchor="middle">チャットUI / 認証 / AIアプリ管理</text>
  <text x="180" y="685" font-size="12" fill="#0F6E56" text-anchor="middle">汎用AI / プロトコル処理</text>

  <!-- まとめ 自作 -->
  <rect x="360" y="625" width="280" height="72" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="500" y="648" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">自作が必要なもの</text>
  <text x="500" y="667" font-size="12" fill="#993C1D" text-anchor="middle">端末UI / 蔵書RAGアプリ</text>
  <text x="500" y="685" font-size="12" fill="#993C1D" text-anchor="middle">ベクトルDB / 変換パイプライン</text>
</svg>
